name: Deploy KinFlo Convex development functions

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "deploy hallowed-manatee-765" to confirm the fixed development target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kinflo-convex-development
  cancel-in-progress: false

jobs:
  deploy-development-functions:
    name: Deploy functions to hallowed-manatee-765
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: kinflo-convex-development
    env:
      EXPECTED_CONVEX_DEPLOYMENT: hallowed-manatee-765
      DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      CONVEX_FAILURE_CLASSIFICATION: not_available_before_preflight
    steps:
      - name: Check out requested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Verify manual development-only binding
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error title=Unsupported trigger::This workflow may run only through workflow_dispatch."
            exit 1
          fi

          if [[ "$DISPATCH_CONFIRMATION" != "deploy $EXPECTED_CONVEX_DEPLOYMENT" ]]; then
            echo "::error title=Confirmation mismatch::Enter the exact development deployment confirmation shown in the workflow form."
            exit 1
          fi

          if [[ -z "${CONVEX_DEPLOY_KEY:-}" ]]; then
            echo "::error title=Missing development deploy key::Configure the protected environment secret CONVEX_DEPLOY_KEY before retrying."
            exit 1
          fi

          deploy_key_binding="${CONVEX_DEPLOY_KEY%%|*}"
          if [[ "$deploy_key_binding" != "dev:$EXPECTED_CONVEX_DEPLOYMENT" ]]; then
            echo "::error title=Development binding rejected::The protected secret is not bound to the approved KinFlo development deployment."
            exit 1
          fi

          if [[ -e .env.local ]]; then
            echo "::error title=Local environment file rejected::.env.local must remain absent."
            exit 1
          fi

          echo "Fixed development deployment binding verified."

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck Convex source locally without credentials
        shell: bash
        run: |
          set -euo pipefail

          preflight_log="$RUNNER_TEMP/kinflo-convex-preflight-${GITHUB_RUN_ID}.log"
          trap 'rm -f "$preflight_log"' EXIT

          if ! env -u CONVEX_DEPLOY_KEY -u CONVEX_DEPLOYMENT npm run convex:check >"$preflight_log" 2>&1; then
            echo "CONVEX_FAILURE_CLASSIFICATION=preflight_local_typecheck_failure" >> "$GITHUB_ENV"
            echo "::error title=Convex source typecheck failed::The credential-free local Convex source typecheck failed. Raw compiler output was withheld to preserve the sanitized evidence boundary."
            exit 1
          fi

          if [[ -e .env.local ]]; then
            echo "CONVEX_FAILURE_CLASSIFICATION=environment_file_policy_failure" >> "$GITHUB_ENV"
            echo "::error title=Environment-file policy failed::The credential-free local typecheck created .env.local unexpectedly; no deployment was attempted."
            exit 1
          fi

      - name: Deploy Convex functions once
        shell: bash
        run: |
          set -euo pipefail
          unset CONVEX_DEPLOYMENT

          deploy_log="$RUNNER_TEMP/kinflo-convex-development-${GITHUB_RUN_ID}.log"
          transient_env_guard_armed="false"
          transient_env_owned="false"

          cleanup() {
            original_status=$?
            trap - EXIT
            cleanup_failure_classification=""

            if ! rm -f -- "$deploy_log" || [[ -e "$deploy_log" ]]; then
              echo "::error title=Ephemeral output cleanup failed::The captured Convex CLI output could not be removed from the runner."
              cleanup_failure_classification="ephemeral_output_cleanup_failure"
            fi

            if [[ "$transient_env_guard_armed" == "true" && -e .env.local ]]; then
              transient_env_owned="true"
            fi

            if [[ "$transient_env_owned" == "true" ]]; then
              if ! rm -f -- .env.local || [[ -e .env.local ]]; then
                echo "::error title=Transient environment cleanup failed::The workflow-created .env.local could not be removed from the runner."
                cleanup_failure_classification="transient_environment_cleanup_failure"
              fi
            fi

            if [[ -n "$cleanup_failure_classification" ]]; then
              echo "CONVEX_FAILURE_CLASSIFICATION=$cleanup_failure_classification" >> "$GITHUB_ENV"
              exit 1
            fi

            exit "$original_status"
          }

          validate_transient_env_keys() {
            local line key
            local saw_deployment="false"
            local saw_url="false"
            local saw_site_url="false"

            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%$'\r'}"
              if [[ -z "$line" || "$line" == \#* ]]; then
                continue
              fi
              if [[ ! "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
                return 1
              fi

              key="${line%%=*}"
              if [[ "$key" == "CONVEX_DEPLOY_KEY" ]]; then
                return 1
              fi

              case "$key" in
                CONVEX_DEPLOYMENT)
                  [[ "$saw_deployment" == "false" ]] || return 1
                  saw_deployment="true"
                  ;;
                VITE_CONVEX_URL)
                  [[ "$saw_url" == "false" ]] || return 1
                  saw_url="true"
                  ;;
                VITE_CONVEX_SITE_URL)
                  [[ "$saw_site_url" == "false" ]] || return 1
                  saw_site_url="true"
                  ;;
                *) return 1 ;;
              esac
            done < .env.local

            [[ "$saw_deployment" == "true" && "$saw_url" == "true" && "$saw_site_url" == "true" ]]
          }

          trap cleanup EXIT

          if [[ -e .env.local ]]; then
            echo "CONVEX_FAILURE_CLASSIFICATION=preexisting_environment_file_rejected" >> "$GITHUB_ENV"
            echo "::error title=Preexisting environment file rejected::.env.local appeared before the bounded Convex command and was left untouched."
            exit 1
          fi

          transient_env_guard_armed="true"

          cli_status=0
          if npx --no-install convex dev --once --typecheck disable --codegen disable --tail-logs disable >"$deploy_log" 2>&1; then
            cli_status=0
          else
            cli_status=$?
          fi

          if [[ -e .env.local ]]; then
            transient_env_owned="true"
            if [[ ! -f .env.local || -L .env.local ]] || ! validate_transient_env_keys; then
              echo "CONVEX_FAILURE_CLASSIFICATION=transient_environment_policy_failure" >> "$GITHUB_ENV"
              echo "::error title=Transient environment policy failed::The workflow-created .env.local did not contain exactly the approved non-secret key names. Values were not printed."
              exit 1
            fi
            echo "CONVEX_TRANSIENT_ENV_STATUS=created_allowlisted_and_removed" >> "$GITHUB_ENV"
          else
            echo "CONVEX_TRANSIENT_ENV_STATUS=not_created" >> "$GITHUB_ENV"
          fi

          if [[ "$cli_status" -ne 0 ]]; then
            failure_classification="bundle_or_push_failure"
            if grep -Eiq "unauthorized|not authorized|permission denied|access denied|do not have access|don't have access|invalid (deploy )?key|deploy key.*(invalid|expired)|authentication" "$deploy_log"; then
              failure_classification="push_authentication_or_authorization"
            elif grep -Eiq 'network|timed out|timeout|connection (refused|reset)|socket hang up|temporary failure|service unavailable|bad gateway|gateway timeout|econnreset|econnrefused|enotfound' "$deploy_log"; then
              failure_classification="push_network_or_service_availability"
            elif grep -Eiq 'deployment.*(not found|mismatch|invalid)|project.*(not found|mismatch|invalid)|invalid deployment|deployment configuration|missing environment variable|environment variable.*missing' "$deploy_log"; then
              failure_classification="push_configuration_or_deployment_binding"
            fi

            case "$failure_classification" in
              push_authentication_or_authorization|push_network_or_service_availability|push_configuration_or_deployment_binding|bundle_or_push_failure) ;;
              *) failure_classification="bundle_or_push_failure" ;;
            esac

            echo "CONVEX_FAILURE_CLASSIFICATION=$failure_classification" >> "$GITHUB_ENV"
            echo "::error title=Convex development deployment failed::The one-attempt Convex CLI run failed with sanitized classification: $failure_classification. Raw CLI output was withheld to preserve the sanitized evidence boundary."
            exit 1
          fi

      - name: Publish sanitized deployment receipt
        shell: bash
        run: |
          {
            echo "### KinFlo Convex development deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Deployment binding: \`dev:$EXPECTED_CONVEX_DEPLOYMENT\`"
            echo "- Status: \`succeeded\`"
            echo "- Credential-free local preflight: \`passed\`"
            echo "- Deployment attempts: \`1\`"
            echo "- Transient environment file: \`$CONVEX_TRANSIENT_ENV_STATUS\`"
            echo "- Production selectable: \`no\`"
            echo "- Secret values printed: \`no\`"
            echo "- \`.env.local\` retained: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized failure receipt
        if: ${{ failure() }}
        shell: bash
        run: |
          {
            echo "### KinFlo Convex development deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Workflow run: [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- Deployment binding: \`dev:$EXPECTED_CONVEX_DEPLOYMENT\`"
            echo "- Status: \`failed; no retry attempted\`"
            echo "- Failure classification: \`$CONVEX_FAILURE_CLASSIFICATION\`"
            echo "- Secret values printed: \`no\`"
            echo "- Raw preflight/deployment output printed: \`no\`"
          } >> "$GITHUB_STEP_SUMMARY"
